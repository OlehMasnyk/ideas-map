services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ideas
      POSTGRES_PASSWORD: ideas
      POSTGRES_DB: ideas_map
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ideas -d ideas_map']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
